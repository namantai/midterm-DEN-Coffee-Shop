<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEN Coffee Shop | Gallery</title>
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>
    <header class="site-header">
        <h1 class="brand">DEN Coffee Shop</h1>
        <nav class="main-nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="menu.html">Menu</a>
            <a href="about.html">About</a>
            <a aria-current="page" class="active" href="gallery.html">Gallery</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="page-main">
        <section class="gallery-wrap">
            <div class="gallery-heading">
                <h1>Gallery</h1>
                <span class="line" aria-hidden="true"></span>

                <div class="gallery-grid">
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-1.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-1.jpg" alt="An espresso sign framed by green plants">
                        </a>
                    </figure>
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-2.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-2.jpg" alt="Two iced lattes on a serving tray">
                        </a>
                    </figure>
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-3.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-3.jpg" alt="Coffee and toast at a café table">
                        </a>
                    </figure>
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-4.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-4.jpg" alt="Espresso and pastries beneath a mirror">
                        </a>
                    </figure>
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-5.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-5.jpg" alt="Coffee by the café window">
                        </a>
                    </figure>
                    <figure>
                        <a class="gallery-photo" href="assets/images/gallery-6.jpg" aria-haspopup="dialog">
                            <img src="assets/images/gallery-6.jpg" alt="Four cups of coffee on a slatted wooden table">
                        </a>
                    </figure>
                </div>
            </div>
        </section>
    </main>

    <dialog id="photo-viewer" aria-label="Gallery photo viewer">
        <div class="viewer-content">
            <div class="viewer-header">
                <span id="photo-position"></span>
                <button type="button" class="viewer-button" id="close-photo" autofocus>Close</button>
            </div>
            <figure class="viewer-figure">
                <img id="large-photo" alt="">
                <figcaption id="photo-caption" aria-live="polite" aria-atomic="true"></figcaption>
            </figure>
            <div class="viewer-controls">
                <button type="button" class="viewer-button" id="previous-photo">← Previous</button>
                <button type="button" class="viewer-button" id="next-photo">Next →</button>
            </div>
        </div>
    </dialog>

    <footer class="site-footer">
        Contact: hello@dencoffee.example &nbsp;|&nbsp; © 2026 DEN COFFEE
    </footer>
    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/gallery.js"></script>
</body>
</html>
